[env.production]
[[env.production.r2_buckets]]
binding = "BILL_IMAGES"
bucket_name = "elbespararen-bill-images"

[env.preview]
[[env.preview.r2_buckets]]
binding = "BILL_IMAGES"
bucket_name = "elbespararen-bill-images"